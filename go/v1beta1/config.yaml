grafeas:
  # Grafeas api server config
  api:
    # Endpoint address
    address: "0.0.0.0:8080"
    # PKI configuration (optional)
    # cafile: ca.crt
    # keyfile: ca.key
    # certfile: ca.crt
    # CORS configuration (optional)
    cors_allowed_origins:
      # - "http://example.net"
    # Authorization configuration. Callers are identified by the common name of
    # the client certificate they authenticate with, so the "policy" mode also
    # requires cafile, keyfile and certfile to be set.
    auth:
      # One of:
      #   "policy":            authorize callers against policy_file.
      #   "deny_all":          deny every request. This is the default.
      #   "insecure_disabled": no authorization at all, every caller can read,
      #                        modify and delete every project. Never use this
      #                        outside of tests and local development.
      mode: "deny_all"
      # Path to the YAML authorization policy, required by the "policy" mode:
      #
      #   bindings:
      #     - identity: "build-system.example.com"
      #       projects: ["my-project"]
      #       permissions: ["projects.get", "notes.create"]
      #
      # "*" is a wildcard, and matches any identity, project or permission.
      policy_file:
  # Supported storage types are "memstore" and "postgres"
  storage_type: "mysql"
  # Postgres options
  # Note: due to storage_type being set to memstore, the below config is a
  # no-op and only preserved here as an example.
  postgres:
    # Database host
    host: "127.0.0.1:5432"
    # Dabase name
    dbname: "postgres"
    # Database username
    user: "postgres"
    # Database password
    password: "password"
    # Valid sslmodes disable, allow, prefer, require, verify-ca, verify-full.
    # See https://www.postgresql.org/docs/current/static/libpq-connect.html for details
    sslmode: "require"
    # 32-bit URL-safe base64 key used to encrypt pagination tokens
    # If one is not provided, it will be generated.
    # Multiple grafeas instances in the same cluster need the same value.
    paginationkey:
  mysql:
    # Database host
    host: "127.0.0.1:3306"
    # Dabase name
    dbname: "grafeas"
    # Database username
    user: "root"
    # Database password
    password: "root"
    # Valid sslmodes disable, allow, prefer, require, verify-ca, verify-full.
    # See https://www.postgresql.org/docs/current/static/libpq-connect.html for details
    sslmode: "disable"
    # 32-bit URL-safe base64 key used to encrypt pagination tokens
    # If one is not provided, it will be generated.
    # Multiple grafeas instances in the same cluster need the same value.
    paginationkey:
